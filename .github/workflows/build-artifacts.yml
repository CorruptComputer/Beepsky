name: Build Artifacts

on:
  push:
    branches:
      - 'develop'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build Packages
        run: |
          cd Beepsky
          dotnet deb --configuration Release --version-suffix nightly --output ../publish/
          dotnet rpm --configuration Release --version-suffix nightly --output ../publish/
          cd ..

      - name: Upload DEB Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: 'DEB build.zip'
          path: ./publish/*.linux-x64.deb

      - name: Upload RPM Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: 'RPM build.zip'
          path: ./publish/*.linux-x64.rpm
